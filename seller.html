<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Organic Fertilizer / Seller Dashboard</title>
	<style>
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			background: #f6f7fb;
			color: #111;
		}

		/* Header */
		.header {
			background-color: green;
			padding: 10px;
			color: white;
		}

		.flex {
			display: flex;
			justify-content: space-between;
			align-items: center;
			text-align: center;
		}

		.profile {
			margin-right: 20px;
			display: flex;
			align-items: center;
		}

		/* Dashboard cards */
		.dashboard {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 20px;
			margin: 20px;
		}

		.card {
			background-color: white;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
			text-align: center;
		}

		.card .title {
			font-size: 16px;
			color: #555;
			margin-bottom: 10px;
		}

		.card .value {
			font-size: 28px;
			font-weight: bold;
		}

		/* Layout */
		.main-content {
			display: grid;
			grid-template-columns: 1fr 2fr;
			gap: 20px;
			padding: 20px;
		}

		/* Orders */
		.orders {
			background: white;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
		}

		/* Products */
		.product-list {
			background: white;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
		}

		.product-list h2 {
			margin-top: 0;
		}

		.add-button {
			background-color: #28a745;
			color: white;
			padding: 8px 16px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			margin-bottom: 20px;
		}

		/* Product card */
		.product-item {
			display: flex;
			align-items: center;
			margin-top: 15px;
			padding: 10px;
			border-radius: 6px;
			background: #fff;
			box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
		}

		.product-item img {
			width: 200px;
			height: 120px;
			margin-right: 15px;
			object-fit: cover;
			border-radius: 4px;
		}

		/* Modal */
		.modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
		}

		.modal-content {
			background-color: white;
			margin: 10% auto;
			padding: 20px;
			border-radius: 8px;
			width: 400px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
			position: relative;
		}

		.close-button {
			position: absolute;
			right: 10px;
			top: 10px;
			background-color: red;
			color: white;
			border: none;
			font-size: 16px;
			padding: 5px 10px;
			cursor: pointer;
			border-radius: 50%;
			max-width: 30px;
		}

		.modal-content input,
		.modal-content textarea,
		.modal-content select {
			width: 100%;
			margin-bottom: 10px;
			padding: 8px;
			border-radius: 4px;
			border: 1px solid #ccc;
		}

		.modal-content button {
			background-color: #28a745;
			color: white;
			border: none;
			padding: 10px;
			width: 100%;
			border-radius: 4px;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<!-- Header -->
	<header class="header">

		<div class="flex">
			<h1>ORGANIC FERTILIZER DELLER</h1>
			<!-- Header Profile Circle -->
			<div class="profile">
				<div id="profileCircle"
					style="width:40px;height:40px;border-radius:50%;background:white;color:green;display:flex;justify-content:center;align-items:center;cursor:pointer;">
					👤</div>
			</div>

			<!-- Feedback Modal -->
			<div id="feedbackModal" class="modal"
				style="display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,0.5);">
				<div class="modal-content"
					style="width:400px;margin:10% auto;padding:20px;border-radius:8px;background:white;position:relative;">
					<button class="close-button" onclick="closeFeedback()"
						style="position:absolute;right:10px;top:10px;background:red;color:white;border:none;font-size:16px;padding:5px 10px;border-radius:50%;cursor:pointer;">×</button>
					<h3>Send Feedback</h3>
					<input type="text" id="feedbackName" placeholder="Your Name" />
					<input type="email" id="feedbackEmail" placeholder="Your Email" />
					<textarea id="feedbackMessage" placeholder="Your Feedback"></textarea>
					<button onclick="sendFeedback()">Submit Feedback</button>
				</div>
			</div>
	</header>

	<!-- Dashboard Cards -->
	<div class="dashboard">
		<div class="card">
			<div class="title">My Products</div>
			<div id="ap" class="value">0</div>
		</div>

		<div class="card">
			<div class="title">My Orders</div>
			<div id="ao" class="value">0</div>
		</div>
	</div>

	<!-- Main Content -->
	<div class="main-content">
		<!-- Orders Section -->
		<aside class="orders">
			<h2>My Orders</h2>
			<div id="orders-list">No orders yet.</div>
		</aside>

		<!-- Products Section -->
		<section class="product-list">
			<h2>My Products</h2>
			<button class="add-button" onclick="openModal()">Add Product</button>

			<!-- Add Product Modal -->
			<div id="productModal" class="modal">
				<div class="modal-content">
					<button class="close-button" onclick="closeModal()">×</button>
					<h3>Add New Product</h3>
					<input type="text" id="productName" placeholder="Product Name" />
					<input type="number" id="productPrice" placeholder="Price ($)" step="0.01" required />
					<input type="number" id="productStock" placeholder="Stock Quantity" required />
					<select id="productType" required>
						<option value="">Select Type</option>
						<option value="Powder">Powder</option>
						<option value="Liquid">Liquid</option>
						<option value="Solid">Solid</option>
						<option value="Compost">Compost</option>
						<option value="Other">Other</option>
					</select>
					<textarea id="productDescription" placeholder="Product Description"></textarea>
					<input type="file" id="productImage" accept="image/*" required />
					<button type="button" onclick="addProduct()">Add Product</button>
				</div>
			</div>

			<!-- Product List Container -->
			<div id="productList"></div>
		</section>
	</div>

	<script type="module" src="seller.js"></script>
	<script>
		function openModal() {
			document.getElementById("productModal").style.display = "block";
		}

		function closeModal() {
			document.getElementById("productModal").style.display = "none";
		}

		// Close modal when clicking outside
		window.onclick = function (event) {
			const productModal = document.getElementById("productModal");
			if (event.target === productModal) closeModal();
		}
	</script>
</body>

</html>
