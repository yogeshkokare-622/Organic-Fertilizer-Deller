<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: 30px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .profile-image {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-image>img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            object-position: center;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        .profile-image>button {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
            width: 100%;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        .mat-form-field {
            flex: 1;
        }

        input[matInput] {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        /* Password toggle button */
        #togglePassword {
            font-size: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        button[mat-mini-fab] {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button[mat-raised-button] {
            display: block;
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        button[mat-raised-button]:hover {
            background-color: #218838;
        }

        /* Password input container */
        .password-container {
            position: relative;
            width: 100%;
        }

        #passwordField {
            padding-right: 40px;
        }

        #togglePassword {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>

</head>

<body>
    <div class="form-container mat-elevation-z5 text-center" *ngIf="user$ | async as user">
        <h1>Update Profile</h1>
        <div class="profile-image">
            <img width="120" height="120" class="margin-top mat-elevation-z1"
                [src]="user.photoURL ?? '/assets/images/image-placeholder.png'" />
            <button mat-mini-fab (click)="inputField.click()">
                <mat-icon>edit</mat-icon>
            </button>
        </div>
        <input #inputField hidden type="file" (change)="uploadFile($event, user)" />

        <form class="margin-top" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
            <div class="row">
                <label>Name</label>

                <mat-form-field>
                    <input type="text" matInput formControlName="fullName" placeholder="Full Name" />
                </mat-form-field>
            </div>

            <div class="row">
                <label>DOB</label>

                <mat-form-field>
                    <input type="date" matInput [matDatepicker]="picker" formControlName="dateOfBirth"
                        placeholder="Date Of Birth" />

                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>

            <div class="row">
                <label>Email</label>

                <mat-form-field>
                    <input type="email" matInput formControlName="emailid" placeholder="Email Id" />
                </mat-form-field>
            </div>

            <div class="row">
                <label>Password</label>
                <div style="position:relative; width: 100%;">
                    <input type="password" id="passwordField" matInput formControlName="password" placeholder="Password"
                        style="width:100%; padding-right: 40px;" />
                    <button type="button" id="togglePassword"
                        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer;">
                        👁️
                    </button>
                </div>
            </div>


            <div class="row">
                <label>Phone</label>

                <mat-form-field>
                    <input type="number" matInput formControlName="phone" placeholder="Phone" />
                </mat-form-field>
            </div>
            <div class="row">
                <label>Address</label>
                <mat-form-field>
                    <input type="text" matInput formControlName="address" placeholder="Address" />
                </mat-form-field>
            </div>



            <button type="submit" class="margin-top" mat-raised-button color="primary">
                Save
            </button>
        </form>
    </div>
    <script src="profile.js" type="module"></script>



</body>

</html>
