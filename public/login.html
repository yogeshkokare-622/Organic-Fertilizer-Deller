<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
            width: 350px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: green;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 300px;
            padding: 12px;
            padding-left: 40px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        .input-box i {
            position: absolute;
            left: 12px;
            top: 12px;
            color: gray;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: green;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: darkgreen;
        }

        .back-btn {
            background: #008CBA;
        }

        .back-btn:hover {
            background: #007bb5;
        }

        .links {
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: #008CBA;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Login</h2>

        <div class="input-box">
            <i>👤</i>
            <input type="email" id="username" placeholder="Enter Email">
        </div>

        <div class="input-box">
            <i>🔒</i>
            <input type="password" id="password" placeholder="Enter Password">
        </div>

        <button type="button" onclick="loginUser()">Login</button>

        <div class="links">
            <p><a href="#" onclick="forgotPassword()">Forgot Password?</a></p>
            <p>Don't have an account? <a href="register.html">Register Here</a></p>
        </div>
    </div>
    <script type="module" src="login.js"></script>
</body>

</html>
